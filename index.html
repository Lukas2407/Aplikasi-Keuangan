<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan — Pencatatan Bulanan untuk 2 Orang</title>
<meta name="description" content="Aplikasi catatan keuangan bulanan untuk dua orang di dua HP berbeda: pemasukan, pengeluaran, anggaran per kategori, sinkronisasi real-time, dan review setiap bulan.">
<meta name="theme-color" content="#5b5bd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4fb; --card:#ffffff; --ink:#1d2135; --mut:#6a7185; --line:#e6e8f2;
  --pri:#5b5bd6; --pri-soft:#eeeefc; --grad:linear-gradient(135deg,#5b5bd6,#8b5cf6);
  --in:#0ca678; --in-soft:#e6f7f1; --out:#e5484d; --out-soft:#fdecec;
  --a:#5b5bd6; --a-soft:#eeeefc; --b:#e64980; --b-soft:#fdeef4;
  --warn:#e8a13c; --r:16px; --shadow:0 2px 10px rgba(29,33,53,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
  min-height:100dvh;
}
button{font-family:inherit}
/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30; background:var(--grad); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
  display:flex; align-items:center; gap:10px;
}
header .logo{
  width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:800;
}
header h1{font-size:17px; margin:0; font-weight:700; flex:1; letter-spacing:.2px}
.syncdot{
  font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px;
  background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); white-space:nowrap;
}
.syncdot.on{background:#0ca678; border-color:#0ca678}
.syncdot.err{background:#e5484d; border-color:#e5484d}
/* ---------- layout ---------- */
main{max-width:560px; margin:0 auto; padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
.card h2{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px}
.mut{color:var(--mut)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.right{text-align:right}
hr.sep{border:0; border-top:1px solid var(--line); margin:10px 0}
/* month selector */
.msel{display:flex; align-items:center; justify-content:center; gap:10px; margin:2px 0 12px}
.mbtn{width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:18px; color:var(--ink); box-shadow:var(--shadow)}
.mbtn:active{transform:scale(.94)}
.mlab{font-weight:700; font-size:16px; min-width:150px; text-align:center}
/* summary */
.sumgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.sum{border-radius:var(--r); padding:12px; color:#fff}
.sum .t{font-size:12px; opacity:.9}
.sum .v{font-size:17px; font-weight:800; margin-top:2px; word-break:break-word}
.sum.in{background:linear-gradient(135deg,#0ca678,#12b886)}
.sum.out{background:linear-gradient(135deg,#e5484d,#f06a6e)}
.sum.net{background:var(--grad); grid-column:1/-1; display:flex; align-items:center; justify-content:space-between}
.sum.net.minus{background:linear-gradient(135deg,#b3383d,#e5484d)}
.sum.net .v{font-size:21px}
/* person chips */
/* banner */
.banner{
  background:#fff7e8; border:1px solid #f2d8a7; border-radius:var(--r); padding:12px 14px;
  margin-bottom:12px; display:flex; gap:10px; align-items:center;
}
.banner .bt{flex:1; font-size:13.5px}
/* bars */
.bar{height:8px; border-radius:99px; background:#edeef6; overflow:hidden; margin-top:5px}
.bar i{display:block; height:100%; border-radius:99px; background:var(--pri)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)}
.crow{padding:8px 0; border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .top{display:flex; justify-content:space-between; gap:8px; font-size:13.5px}
/* transaction rows */
.tdate{font-size:12px; font-weight:700; color:var(--mut); margin:12px 2px 4px; display:flex; justify-content:space-between}
.trow{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
  display:flex; align-items:center; gap:10px; margin-bottom:6px; cursor:pointer;
}
.trow:active{background:#fafafd}
.tic{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--pri-soft); flex:none}
.tmid{flex:1; min-width:0}
.tmid .n{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tmid .s{font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tamt{font-weight:700; font-size:14px; white-space:nowrap}
.tamt.in{color:var(--in)} .tamt.out{color:var(--out)}
/* chips & filters */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:600;
}
.chip.on{background:var(--pri); border-color:var(--pri); color:#fff}
input,select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
  font-size:15px; font-family:inherit; background:#fbfbfe; color:var(--ink); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri); background:#fff}
.field{margin-bottom:10px}
.field label{display:block; font-size:12px; font-weight:700; color:var(--mut); margin-bottom:5px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:0; border-radius:13px; padding:12px 16px; font-size:14.5px; font-weight:700; cursor:pointer;
  background:var(--pri); color:#fff; width:100%;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:var(--out-soft); color:var(--out)}
.btn.green{background:var(--in)}
.btn.sm{width:auto; padding:8px 13px; font-size:13px; border-radius:11px}
.iconbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; width:34px; height:34px; font-size:15px}
/* segmented */
.seg{display:flex; background:#edeef6; border-radius:13px; padding:4px; gap:4px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--mut)}
.seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg button.on.tin{color:var(--in)} .seg button.on.tout{color:var(--out)}
.persw{margin-bottom:10px}
.persw button.on.pa{color:var(--a); box-shadow:0 1px 4px rgba(0,0,0,.12), inset 0 -2px 0 var(--a)}
.persw button.on.pb{color:var(--b); box-shadow:0 1px 4px rgba(0,0,0,.12), inset 0 -2px 0 var(--b)}
/* rincian barang dari struk */
.tagx{display:inline-block; background:var(--pri-soft); color:var(--pri); border-radius:99px; padding:1px 7px; font-size:10.5px; font-weight:700; vertical-align:1px}
.itemlist{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; background:#fbfbfe}
.itemlist .ilh{font-size:12px; font-weight:700; color:var(--mut); margin-bottom:6px}
.itemlist .ili{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0}
.itrow{border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; background:#fbfbfe}
.itrow .itop{display:flex; gap:8px; align-items:center}
.itrow .ibot{display:grid; grid-template-columns:1fr 1.25fr; gap:8px; margin-top:7px}
.itrow input,.itrow select{padding:9px 10px; font-size:13.5px}
.itrow .iamt{text-align:right}
.scantotal{text-align:right; font-size:15px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line)}
.btn.big{padding:16px; font-size:15.5px}
/* aksi cepat di Beranda */
/* mode lihat saja */
.robar{display:flex; align-items:center; gap:10px; background:#eef1f8; border:1px solid #d9dfee;
  border-radius:14px; padding:10px 12px; margin-bottom:10px}
.robar .ri{font-size:20px} .robar .rt{flex:1; font-size:13px}
.vtx{border:1px solid var(--line); border-radius:14px; padding:14px; background:#fbfbfe}
.vamt{font-size:26px; font-weight:800; text-align:center; margin-bottom:10px}
.vamt.in{color:var(--in)} .vamt.out{color:var(--out)}
.vrow{display:flex; justify-content:space-between; gap:12px; font-size:13.5px; padding:5px 0; border-top:1px solid var(--line)}
.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.quick button{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 8px;
  border:1px solid var(--line); background:var(--card); border-radius:14px; cursor:pointer;
  font-size:12.5px; font-weight:700; color:var(--ink); box-shadow:var(--shadow); min-height:64px; justify-content:center;
}
.quick button:active{transform:scale(.97)}
.quick button .i{font-size:20px; line-height:1}
.limrow{display:grid; grid-template-columns:1fr 96px 118px; gap:8px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
.limrow:last-of-type{border-bottom:0}
.limrow .ln{font-size:13.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.limrow input{padding:9px 10px; font-size:14px; text-align:right}
.limrow select{padding:9px 6px; font-size:12.5px}
.owner{border-radius:12px; padding:9px 12px; font-size:12.5px; margin-bottom:10px}
.owner.a{background:var(--a-soft); color:var(--a)} .owner.b{background:var(--b-soft); color:var(--b)}
/* category picker grid */
.catgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.catopt{border:1.5px solid var(--line); background:#fbfbfe; border-radius:13px; padding:8px 4px; text-align:center; cursor:pointer}
.catopt .i{font-size:20px} .catopt .n{font-size:10.5px; font-weight:600; margin-top:2px; color:var(--mut); line-height:1.2}
.catopt.on{border-color:var(--pri); background:var(--pri-soft)}
.catopt.on .n{color:var(--pri)}
/* big amount input */
.amount{font-size:26px; font-weight:800; text-align:center; letter-spacing:.5px; padding:14px}
/* bottom nav */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; align-items:flex-end;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
nav button{
  flex:1; border:0; background:none; color:var(--mut); font-size:10.5px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; cursor:pointer;
}
nav button .i{font-size:21px; line-height:1}
nav button.on{color:var(--pri)}
nav .fabwrap{flex:1; display:flex; justify-content:center}
.fab{
  width:54px; height:54px; border-radius:50%; border:0; background:var(--grad); color:#fff;
  font-size:28px; font-weight:400; box-shadow:0 4px 14px rgba(91,91,214,.45);
  margin-top:-26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.fab:active{transform:scale(.94)}
/* modal */
#overlay{
  position:fixed; inset:0; background:rgba(20,22,40,.5); z-index:50; display:none;
  align-items:flex-end; justify-content:center;
}
#overlay.open{display:flex}
#modal{
  background:var(--card); width:100%; max-width:560px; max-height:88dvh; overflow:auto;
  border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
#modal h3{margin:0 0 12px; font-size:16px; display:flex; align-items:center; justify-content:space-between}
.x{border:0; background:#edeef6; border-radius:99px; width:30px; height:30px; font-size:14px; cursor:pointer}
/* legenda grafik */
.legend{display:flex; gap:14px; justify-content:center; margin-top:6px; font-size:12px; color:var(--mut)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend .sw{width:11px; height:11px; border-radius:3px; display:inline-block}
.legend .sw.hatch{background:var(--out);
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2px, transparent 2px 4px)}
/* blok khusus cetak / PDF */
.printonly{display:none}
/* layar kunci */
#lock{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:20px;
  background:var(--grad); color:#fff}
#lock.on{display:flex}
.lockbox{background:var(--card); color:var(--ink); border-radius:22px; padding:26px 20px; width:100%; max-width:340px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25)}
.lockbox h2{margin:0; font-size:19px}
.lockicon{font-size:38px; margin-bottom:6px}
.pinin{text-align:center; font-size:24px; letter-spacing:8px; padding:14px}
/* toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom));
  background:#23263c; color:#fff; padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600;
  z-index:60; opacity:0; pointer-events:none; transition:opacity .25s; max-width:88vw; text-align:center;
}
#toast.show{opacity:1}
/* review bits */
.verdict{border-radius:var(--r); padding:14px; color:#fff; margin-bottom:12px}
.verdict.good{background:linear-gradient(135deg,#0ca678,#12b886)}
.verdict.ok{background:linear-gradient(135deg,#e8a13c,#f0b458)}
.verdict.bad{background:linear-gradient(135deg,#b3383d,#e5484d)}
.verdict .big{font-size:18px; font-weight:800}
.stat2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
.stat .t{font-size:11.5px; color:var(--mut); font-weight:700}
.stat .v{font-size:15px; font-weight:800; margin-top:2px}
.delta{font-size:11.5px; font-weight:700}
.delta.up{color:var(--out)} .delta.down{color:var(--in)} .delta.flat{color:var(--mut)}
.donebadge{background:var(--in-soft); color:var(--in); border-radius:12px; padding:10px 12px; font-size:13px; font-weight:700; margin-bottom:10px}
.mhist{display:flex; gap:6px; flex-wrap:wrap}
.mhist button{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:6px 9px; font-size:11.5px; font-weight:700; color:var(--mut)}
.mhist button.done{background:var(--in-soft); color:var(--in); border-color:#bfe8da}
.mhist button.cur{outline:2px solid var(--pri)}
/* settings rows */
.srow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .n{flex:1; font-size:14px; min-width:0}
.srow .n .b{font-size:11.5px; color:var(--mut)}
.empty{text-align:center; padding:26px 10px; color:var(--mut)}
.empty .e{font-size:40px; margin-bottom:8px}
a{color:var(--pri)}
/* ---------- tampilan cetak / PDF ---------- */
@media print{
  @page{margin:14mm}
  html,body{background:#fff; font-size:12px}
  header,nav,#toast,#overlay,#lock,.noprint,.msel,.persw,.fab{display:none !important}
  main{max-width:none; margin:0; padding:0}
  .printonly{display:block}
  .printonly .pt{font-size:19px; font-weight:800}
  .printonly .ps{font-size:12px; color:var(--mut); margin-bottom:12px}
  .noteprint{border:1px solid var(--line); border-radius:8px; padding:10px; white-space:pre-wrap; font-size:12px}
  .card{box-shadow:none; border:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; margin-bottom:10px}
  .verdict,.sum,.stat,.bar i,.legend .sw,svg{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .verdict{break-inside:avoid}
  .stat2{display:grid; grid-template-columns:repeat(4,1fr)}
  svg{max-width:520px}
}
</style>
</head>
<body>

<header>
  <span class="logo">£</span>
  <h1>Catatan Keuangan</h1>
  <span id="syncDot" class="syncdot">☁️ Lokal</span>
</header>

<main id="view"></main>

<nav>
  <button data-tab="home" onclick="go('home')"><span class="i">🏠</span>Beranda</button>
  <button data-tab="hist" onclick="go('hist')"><span class="i">🧾</span>Riwayat</button>
  <div class="fabwrap"><button class="fab" onclick="openTx()" title="Catat transaksi">＋</button></div>
  <button data-tab="review" onclick="go('review')"><span class="i">📈</span>Review</button>
  <button data-tab="set" onclick="go('set')"><span class="i">⚙️</span>Atur</button>
</nav>

<div id="overlay"><div id="modal"></div></div>
<div id="lock"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Catatan Keuangan — pencatatan bulanan untuk 2 orang, 2 HP.
   Satu file, tanpa server sendiri. Data tersimpan lokal (localStorage)
   dan bisa disinkronkan real-time antar HP lewat Firebase milik sendiri
   (pola yang sama dengan aplikasi Warung COGS di repo ini).
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* mata uang: £ (bawaan, dengan pence) atau Rp — bisa diganti di Atur → Profil */
const CURS={GBP:{sym:'£', locale:'en-GB', dec:2}, IDR:{sym:'Rp ', locale:'id-ID', dec:0}};
const cur=()=>CURS[(S.settings&&S.settings.currency)||'GBP']||CURS.GBP;
const rp=n=>{const c=cur(), v=Math.abs(Number(n)||0), fr=c.dec>0&&Math.round(v*100)%100!==0;
  return c.sym+v.toLocaleString(c.locale,{minimumFractionDigits:fr?2:0, maximumFractionDigits:c.dec});};
const rpS=n=>(n<0?'−':'')+rp(n);
const num=v=>{
  const c=cur(), s=String(v);
  if(c.dec===0) return Number(s.replace(/[^\d]/g,''))||0;
  const n=parseFloat(s.replace(/[^\d.]/g,''));
  return isFinite(n)&&n>0?Math.round(n*100)/100:0;
};
const amtStr=n=>{const c=cur(), v=Number(n)||0, fr=c.dec>0&&Math.round(v*100)%100!==0;
  return v?v.toLocaleString(c.locale,{minimumFractionDigits:fr?2:0, maximumFractionDigits:c.dec}):'';};
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAY=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const mkeyNow=()=>todayStr().slice(0,7);
const mLabel=k=>{const p=k.split('-'); return MON[+p[1]-1]+' '+p[0];};
const mShort=k=>{const p=k.split('-'); return MON[+p[1]-1].slice(0,3)+' '+String(p[0]).slice(2);};
const mAdd=(k,d)=>{let p=k.split('-').map(Number), y=p[0], m=p[1]+d; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+pad(m);};
const dLabel=ds=>{const d=new Date(ds+'T12:00:00'); return DAY[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3);};
const daysInMonth=k=>{const p=k.split('-').map(Number); return new Date(p[0],p[1],0).getDate();};
function rid(n){const c='abcdefghijklmnopqrstuvwxyz0123456789'; const a=new Uint32Array(n); crypto.getRandomValues(a); let s=''; for(let i=0;i<n;i++)s+=c[a[i]%c.length]; return s;}

/* ---------- kunci pribadi: PIN di-hash SHA-256 ----------
   Yang disimpan & disinkronkan hanya hash-nya, tidak pernah PIN aslinya.
   Fallback murni JS dipakai saat crypto.subtle tidak tersedia (mis. file://). */
function sha256js(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const b=[...new TextEncoder().encode(msg)], bl=b.length*8;
  b.push(0x80); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push((bl/Math.pow(2,i*8))&0xff);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<b.length;i+=64){
    const w=new Array(64);
    for(let j=0;j<16;j++) w[j]=(b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3];
    for(let j=16;j<64;j++){
      const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3), s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    let [a,bb,c,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[j]+w[j])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&bb)^(a&c)^(bb&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0;
    }
    H=H.map((x,k)=>(x+[a,bb,c,d,e,f,g,h][k])|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha256(s){
  if(window.crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }catch(e){/* jatuh ke fallback */}
  }
  return sha256js(s);
}

function sums(k,who){
  const r={inn:0,out:0,net:0,count:0,byCatOut:{},byCatIn:{}};
  for(const t of txMonth(k,who)){
    const a=Number(t.amount)||0;
    r.count++;
    if(t.type==='in'){ r.inn+=a; r.byCatIn[t.catId]=(r.byCatIn[t.catId]||0)+a; }
    else{ r.out+=a; r.byCatOut[t.catId]=(r.byCatOut[t.catId]||0)+a; }
  }
  r.net=r.inn-r.out;
  return r;
}
/* Anggaran disimpan per orang: {a:…, b:…}. Nilai lama berupa angka
   tunggal tetap terbaca sebagai anggaran yang sama untuk keduanya. */
const budgetOf=(c,who)=>{const b=c&&c.budget; return typeof b==='object'&&b?(Number(b[who])||0):(Number(b)||0);};
function setBudgetOf(c,who,v){
  if(typeof c.budget!=='object'||!c.budget){const old=Number(c.budget)||0; c.budget={a:old,b:old};}
  c.budget[who]=v;
}
/* Batas pengeluaran bisa dipatok per hari, per minggu, atau per bulan.
   Semuanya dihitung ulang menjadi batas satu bulan penuh agar bisa
   dibandingkan dengan realisasi bulan berjalan. */
const PERIODS={day:{lab:'per hari', short:'/hr'}, week:{lab:'per minggu', short:'/mgg'}, month:{lab:'per bulan', short:'/bln'}};
const periodOf=(c,who)=>{const p=c&&c.period; const v=(typeof p==='object'&&p)?p[who]:p; return PERIODS[v]?v:'month';};
function setPeriodOf(c,who,v){
  if(typeof c.period!=='object'||!c.period){const old=PERIODS[c.period]?c.period:'month'; c.period={a:old,b:old};}
  c.period[who]=PERIODS[v]?v:'month';
}
function monthLimit(c,who,mk){
  const amt=budgetOf(c,who); if(amt<=0) return 0;
  const per=periodOf(c,who), d=daysInMonth(mk);
  return per==='day'?amt*d : per==='week'?amt*d/7 : amt;
}
const limitLabel=(c,who)=>{const per=periodOf(c,who); return rp(budgetOf(c,who))+(per==='month'?'':' '+PERIODS[per].short);};
const totalLimit=who=>Number((S.settings.limitTotal||{})[who])||0;
/* sisa hari pada bulan berjalan (bulan lain dihitung penuh) */
function daysLeft(mk){
  const d=daysInMonth(mk);
  if(mk!==mkeyNow()) return d;
  return Math.max(1, d - new Date().getDate() + 1);
}

function pctDelta(cur,prev){
  if(!prev) return null;
  return Math.round((cur-prev)/prev*100);
}
function deltaBadge(d,goodWhenDown){
  if(d===null||!isFinite(d)) return '';
  if(d===0) return `<span class="delta flat">= sama</span>`;
  const up=d>0, good=goodWhenDown?!up:up;
  return `<span class="delta ${good?'down':'up'}">${up?'▲':'▼'} ${Math.abs(d)}%</span>`;
}
/* ---------- grafik pemasukan vs pengeluaran (SVG, tanpa pustaka luar) ----------
   Kolom berkelompok: satu kelompok per bulan, hijau = masuk, merah = keluar.
   Kombinasi hijau/merah termasuk sulit dibedakan pada buta warna deutan, jadi
   identitasnya diperkuat tiga lapis: urutan posisi tetap (masuk selalu kiri),
   legenda, dan arsiran pada batang pengeluaran. */
function niceMax(v){
  if(v<=0) return 1;
  const p=Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.25,1.5,2,2.5,3,4,5,6,8,10]) if(p*m>=v) return p*m;
  return p*10;
}
function barPath(x,y,w,h,r){
  r=Math.max(0, Math.min(r, w/2, h));
  return `M${x},${y+h}L${x},${y+r}Q${x},${y} ${x+r},${y}L${x+w-r},${y}Q${x+w},${y} ${x+w},${y+r}L${x+w},${y+h}Z`;
}
function chartIO(msums,k){
  const W=360,H=204,padL=48,padR=10,padT=12,padB=30;
  const pw=W-padL-padR, ph=H-padT-padB, n=msums.length, slot=pw/n;
  const bw=Math.min(20,(slot-14)/2), gap=2;
  const max=niceMax(Math.max(...msums.flatMap(x=>[x.s.inn,x.s.out]),0));
  const y=v=>padT+ph-(v/max)*ph;
  const tick=v=>{const c=cur(); return c.sym+(v>=1000?(v/1000).toLocaleString(c.locale,{maximumFractionDigits:1})+'k':Math.round(v).toLocaleString(c.locale));};
  let g='';
  // garis bantu tipis + label sumbu
  for(const f of [0,.5,1]){
    const v=max*f, yy=y(v);
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#e6e8f2" stroke-width="1"/>`;
    g+=`<text x="${padL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6a7185">${esc(tick(v))}</text>`;
  }
  msums.forEach(({m,s},i)=>{
    const cx=padL+slot*i+slot/2;
    if(m===k) g+=`<rect x="${cx-slot/2+2}" y="${padT-4}" width="${slot-4}" height="${ph+8}" rx="7" fill="#eeeefc"/>`;
    const x1=cx-bw-gap/2, x2=cx+gap/2;
    if(s.inn>0) g+=`<path d="${barPath(x1,y(s.inn),bw,padT+ph-y(s.inn),4)}" fill="#0ca678"/>`;
    if(s.out>0) g+=`<path d="${barPath(x2,y(s.out),bw,padT+ph-y(s.out),4)}" fill="url(#hatchOut)"/>`;
    g+=`<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="10" fill="${m===k?'#1d2135':'#6a7185'}" font-weight="${m===k?'700':'400'}">${esc(mShort(m))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="Grafik batang pemasukan dan pengeluaran enam bulan terakhir">
    <defs><pattern id="hatchOut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#e5484d"/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
    </pattern></defs>
    <line x1="${padL}" y1="${padT+ph}" x2="${W-padR}" y2="${padT+ph}" stroke="#c9cddd" stroke-width="1"/>
    ${g}</svg>`;
}
const chartLegend=()=>`<div class="legend">
  <span><i class="sw" style="background:#0ca678"></i>Pemasukan</span>
  <span><i class="sw hatch"></i>Pengeluaran</span></div>`;

function vReview(){
  const k=UI.month, w=UI.who, s=sums(k,w), sp=sums(mAdd(k,-1),w), mine=w===L.me;
  const rv=S.reviews[k]||{};
  let h=`<div class="printonly">
    <div class="pt">Review Keuangan Bulanan</div>
    <div class="ps">${esc(nameOf(w))} · ${esc(mLabel(k))} · dicetak ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</div>
  </div>`;
  h+=`<div class="small mut noprint" style="margin:2px 2px 8px">📋 Review bulanan ${esc(nameOf(w))} — lihat rapor masing-masing, lalu tulis kesepakatan bersama di bawah.</div>`;
  h+=personSel()+roBanner()+monthSel();
  // riwayat 6 bulan
  h+=`<div class="mhist noprint" style="margin-bottom:12px">`+
    [...Array(6)].map((_,i)=>{const mk=mAdd(mkeyNow(),-(5-i)); const done=S.reviews[mk]&&S.reviews[mk].done;
      return `<button class="${done?'done':''} ${mk===k?'cur':''}" onclick="goReview('${mk}')">${done?'✅ ':''}${esc(mShort(mk))}</button>`;}).join('')+`</div>`;
  if(!s.count){
    h+=`<div class="card"><div class="empty"><div class="e">🗓️</div>${esc(nameOf(w))} belum punya transaksi di ${esc(mLabel(k))},<br>jadi belum ada yang bisa direview.</div></div>`;
    return h;
  }
  // vonis kesehatan keuangan
  const rate=s.inn>0?Math.round(s.net/s.inn*100):null;
  const you=mine?'Kamu':esc(nameOf(w));
  let cls='ok', icon='🙂', txt;
  if(s.net<0){ cls='bad'; icon='🚨'; txt=`Defisit ${rp(s.net)} — pengeluaran melebihi pemasukan.`; }
  else if(rate!==null&&rate>=20){ cls='good'; icon='🌟'; txt=`Hebat! ${you} menyisakan ${rate}% dari pemasukan (${rp(s.net)}).`; }
  else txt=`Sisa ${rpS(s.net)}${rate!==null?` (${rate}% dari pemasukan)`:''} — masih bisa ditingkatkan.`;
  h+=`<div class="verdict ${cls}"><div style="font-size:26px">${icon}</div><div class="big">${txt}</div>
    <div class="small" style="opacity:.9;margin-top:4px">${s.count} transaksi ${esc(nameOf(w))} di ${esc(mLabel(k))}</div></div>`;
  // angka utama + perbandingan bulan lalu
  h+=`<div class="stat2">
    <div class="stat"><div class="t">PEMASUKAN</div><div class="v" style="color:var(--in)">${rp(s.inn)}</div>${deltaBadge(pctDelta(s.inn,sp.inn),false)}</div>
    <div class="stat"><div class="t">PENGELUARAN</div><div class="v" style="color:var(--out)">${rp(s.out)}</div>${deltaBadge(pctDelta(s.out,sp.out),true)}</div>
    <div class="stat"><div class="t">RATA-RATA / HARI</div><div class="v">${rp(s.out/daysInMonth(k))}</div><span class="tiny mut">pengeluaran</span></div>
    <div class="stat"><div class="t">BULAN LALU (${esc(mShort(mAdd(k,-1)))})</div><div class="v">${rpS(sp.net)}</div><span class="tiny mut">sisa</span></div>
  </div>`;
  // grafik pemasukan vs pengeluaran + rincian 6 bulan
  const mks=[...Array(6)].map((_,i)=>mAdd(k,-(5-i)));
  const msums=mks.map(m=>({m, s:sums(m,w)}));
  if(msums.some(x=>x.s.count)){
    h+=`<div class="card"><h2>📊 Pemasukan vs Pengeluaran</h2>
      <div class="small mut" style="margin:-4px 0 6px">${esc(mLabel(k))} · masuk <b style="color:var(--in)">${rp(s.inn)}</b> · keluar <b style="color:var(--out)">${rp(s.out)}</b></div>
      ${chartIO(msums,k)}${chartLegend()}
      <div class="tiny mut" style="margin-top:6px">Enam bulan terakhir milik ${esc(nameOf(w))}; bulan yang sedang direview disorot.</div></div>`;
    const maxOut=Math.max(...msums.map(x=>x.s.out), 1);
    h+=`<div class="card"><h2>📈 Rincian 6 Bulan ${esc(nameOf(w))}</h2>
      <div class="tiny mut" style="margin-bottom:8px">Pengeluaran tiap bulan, dibanding bulan tertinggi.</div>`;
    for(const {m, s:s2} of msums){
      if(!s2.count){ h+=`<div class="crow"><div class="top"><span class="mut">${esc(mShort(m))}</span><span class="tiny mut">belum ada catatan</span></div></div>`; continue; }
      h+=`<div class="crow"><div class="top"><span><b>${esc(mShort(m))}</b>${m===k?' <span class="tiny" style="color:var(--pri)">◀ bulan ini</span>':''}</span>
        <b style="color:${s2.net<0?'var(--out)':'var(--in)'}">${s2.net<0?'−':'+'}${rp(s2.net)}</b></div>
        <div class="bar" style="margin-top:6px"><i style="width:${Math.round(s2.out/maxOut*100)}%;background:var(--${w})"></i></div>
        <div class="tiny mut" style="margin-top:3px">keluar ${rp(s2.out)} · masuk ${rp(s2.inn)}</div></div>`;
    }
    h+=`</div>`;
  }
  // batas vs realisasi
  const tlim=totalLimit(w);
  const brows=S.categories.filter(c=>c.type==='out'&&(budgetOf(c,w)>0||(s.byCatOut[c.id]||0)>0))
    .map(c=>({c,spent:s.byCatOut[c.id]||0})).sort((x,y)=>y.spent-x.spent);
  if(tlim>0||brows.length){
    h+=`<div class="card"><h2>🎯 Batas vs Realisasi
      ${viewOnly()?'':`<button class="btn ghost sm noprint" style="margin-left:auto" onclick="openLimits()">Atur</button>`}</h2>`;
    if(tlim>0){
      h+=`<div class="crow"><div class="top"><span>${s.out<=tlim?'✅':'❌'} <b>Batas total bulanan</b></span>
        <b>${rp(s.out)}<span class="mut tiny"> / ${rp(tlim)}</span></b></div>
        <div class="bar"><i class="${s.out>tlim?'over':(s.out>tlim*.8?'warn':'')}" style="width:${Math.min(100,Math.round(s.out/tlim*100))}%"></i></div></div>`;
    }
    for(const {c,spent} of brows){
      const b=monthLimit(c,w,k), per=periodOf(c,w);
      const st=b>0?(spent<=b?'✅':'❌'):'·';
      h+=`<div class="crow"><div class="top"><span>${st} ${c.icon} ${esc(c.name)}</span>
        <b>${rp(spent)}${b>0?`<span class="mut tiny"> / ${rp(b)}</span>`:''}</b></div>
        ${b>0?`<div class="bar"><i class="${spent>b?'over':(spent>b*.8?'warn':'')}" style="width:${Math.min(100,Math.round(spent/b*100))}%"></i></div>`:''}
        ${b>0&&per!=='month'?`<div class="tiny mut" style="margin-top:3px">batas ${limitLabel(c,w)}</div>`:''}</div>`;
    }
    h+=`<div class="tiny mut" style="margin-top:8px">Batas ini milik ${esc(nameOf(w))} sendiri.</div></div>`;
  }
  // 5 pengeluaran terbesar
  const top=txMonth(k,w).filter(t=>t.type==='out').sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,5);
  if(top.length){
    h+=`<div class="card"><h2>🔥 5 Pengeluaran Terbesar</h2>${top.map(txRow).join('')}</div>`;
  }
  // catatan review + tandai selesai
  if(viewOnly()){
    h+=`<div class="card"><h2>✍️ Catatan & Kesepakatan Review</h2>
      ${rv.note?`<div class="noteprint" style="display:block">${esc(rv.note)}</div>`:'<div class="small mut">(belum ada catatan)</div>'}
      <div class="tiny mut" style="margin-top:8px">Catatan ini bisa kamu tulis dari tampilan catatanmu sendiri.</div></div>`;
  }
  h+=`<div class="card noprint"><h2>📄 Simpan Review sebagai PDF</h2>
    <p class="small mut" style="margin:0 0 10px">Menyusun laporan rapi berisi grafik, angka, batas, dan catatan kesepakatan
      untuk ${esc(nameOf(w))} bulan ${esc(mLabel(k))}. Pada dialog cetak yang muncul, pilih tujuan
      <b>“Simpan sebagai PDF”</b> (Android: <i>Save as PDF</i>, iPhone: cubit-perbesar lalu Bagikan).</p>
    <button class="btn" onclick="printReview()">📄 Buat PDF Review</button></div>`;
  if(!viewOnly()) h+=`<div class="card"><h2>✍️ Catatan & Kesepakatan Review</h2>
    ${rv.done?`<div class="donebadge">✅ Review ${esc(mLabel(k))} selesai — ditandai oleh ${esc(nameOf(rv.by||'a'))}${rv.doneAt?', '+new Date(rv.doneAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):''}</div>`:''}
    <textarea class="noprint" id="revNote" rows="4" placeholder="Tulis hasil diskusi kalian… contoh: 'Bulan depan jatah ngopi dikurangi separuh', 'Naikkan setoran tabungan bulanan'." oninput="revNote('${k}',this)">${esc(rv.note||'')}</textarea>
    <div class="printonly noteprint">${rv.note?esc(rv.note):'(belum ada catatan)'}</div>
    <div class="noprint" style="margin-top:10px">${rv.done
      ?`<button class="btn ghost" onclick="revDone('${k}',true)">↩️ Buka lagi review ini</button>`
      :`<button class="btn green" onclick="revDone('${k}',false)">✅ Tandai Review Selesai (oleh ${esc(nameOf(L.me))})</button>`}</div>
    <div class="tiny mut noprint" style="margin-top:8px">Catatan ini ikut tersinkron, jadi pengguna satunya bisa membacanya di HP-nya.</div></div>`;
  return h;
}
window.printReview=()=>{
  const n=$('#revNote');                      // pastikan catatan terbaru ikut tercetak
  if(n){ const p=document.querySelector('.noteprint'); if(p) p.textContent=n.value||'(belum ada catatan)'; }
  window.print();
};
let _rnT=null;
window.revNote=(k,el)=>{
  clearTimeout(_rnT);
  _rnT=setTimeout(()=>{ const r=S.reviews[k]||(S.reviews[k]={}); r.note=el.value; r.at=Date.now(); save(); queueSync('reviews'); },500);
};
window.revDone=(k,reopen)=>{
  if(!needEdit(UI.who)) return;
  const r=S.reviews[k]||(S.reviews[k]={});
  const note=$('#revNote'); if(note){ r.note=note.value; }
  r.done=!reopen; r.by=authUser()||L.me; r.at=Date.now(); r.doneAt=r.done?Date.now():null;
  save(); queueSync('reviews'); render();
  toast(r.done?'🎉 Review '+mLabel(k)+' selesai!':'Review dibuka kembali.');
};

/* =====================================================================
   PEMINDAI STRUK BELANJA
   Foto struk dibaca dengan OCR (Tesseract.js, diunduh sekali lalu
   tersimpan di cache browser), teksnya diurai menjadi daftar barang,
   lalu kamu tinjau/perbaiki sebelum disimpan. Selalu ada jalur manual
   (ketik/tempel teks struk) agar tetap bisa dipakai tanpa internet.
   ===================================================================== */
const ocrPaths=()=>Object.assign({
  lib:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  /* model ringkas: unduhan ±2 MB dan penyiapan ±6x lebih cepat daripada
     model standar. Bila alamatnya tak tersedia, otomatis jatuh ke model standar. */
  lang:'https://tessdata.projectnaptha.com/4.0.0_fast',
  langFallback:'https://tessdata.projectnaptha.com/4.0.0',
  gzip:true
}, window.OCR_PATHS||{});

/* --- penguraian teks struk (fungsi murni, bisa diuji terpisah) --- */
const RE_TOTAL=/^\s*(grand\s*total|total\s*(belanja|bayar|harga)?|jumlah)\b/i;
const RE_SKIP=/(sub\s*total|vat|tax|ppn|pajak|service|cash|tunai|change|kembali|card|debit|credit|visa|master|e-?wallet|qris|gopay|ovo|diskon|discount|voucher|promo|point|poin|saldo|balance|bayar|payment|tender|pembulatan|round|terima\s*kasih|thank|kasir|cashier|struk|receipt|invoice|npwp|no\.?\s*(trans|struk|hp)|tanggal|date|time|jam|telp|phone|alamat|address|www\.|\.com|member|kembalian)/i;
const RE_QTY_LEAD=/^\s*(\d{1,3})\s*[xX*]\s*/;
const RE_UNIT=/\s(\d{1,3})\s*[xX@]\s*([\d][\d.,]*)\s*$/;
function parsePrice(s){
  const c=cur();
  const t=String(s||'').replace(/[^\d.,]/g,'');
  if(!t) return null;
  if(c.dec>0){
    const m=t.match(/^(\d{1,3}(?:[,.]\d{3})*|\d+)(?:[.,](\d{1,2}))?$/);
    if(!m) return null;
    const whole=Number(m[1].replace(/[.,]/g,''));
    const frac=m[2]?Number((m[2]+'0').slice(0,2))/100:0;
    return whole+frac;
  }
  const d=t.replace(/[.,]/g,'');
  return d?Number(d):null;
}
function parseReceipt(text){
  const items=[]; let total=null;
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.replace(/\s+/g,' ').trim();
    if(line.length<3) continue;
    const tail=line.match(/([\d][\d.,]*)\s*[A-Za-z*#]{0,3}\s*$/);
    if(!tail) continue;
    const price=parsePrice(tail[1]);
    if(price===null||price<=0) continue;
    if(RE_TOTAL.test(line)){ if(total===null) total=price; continue; }
    if(RE_SKIP.test(line)) continue;
    let name=line.slice(0, tail.index).trim().replace(/[.\-–—:*]+$/,'').trim();
    let qty=1;
    const unit=name.match(RE_UNIT)||line.match(RE_UNIT);
    const lead=name.match(RE_QTY_LEAD);
    if(lead){ qty=Number(lead[1])||1; name=name.replace(RE_QTY_LEAD,'').trim(); }
    else if(unit){ qty=Number(unit[1])||1; name=name.replace(RE_UNIT,'').trim(); }
    if((name.match(/[A-Za-z]/g)||[]).length<2) continue;   // buang baris angka/tanggal
    if(name.length>60) name=name.slice(0,60);
    items.push({n:name, q:qty, p:price, c:guessCat(name)});
  }
  return {items, total};
}
/* tebakan kategori dari nama barang — kata kunci Indonesia & Inggris */
const CAT_HINTS=[
  ['baju',     ['baju','kaos','kaus','kemeja','celana','jaket','dress','rok','jeans','hoodie','sweater','pakaian','t-shirt','tshirt','shirt','trouser','skirt','coat','jacket','kaos kaki','sock','underwear','bra','piyama','sepatu','sandal','shoe','tas','hijab','jilbab']],

  ['makan',    ['nasi','ayam','mie','bakso','soto','kopi','coffee','teh','tea','roti','bread','susu','milk','air mineral','snack','makan','minum','sandwich','burger','pizza','juice','jus','coklat','chocolate','biskuit','biscuit','gula','garam','telur','egg','beras','rice','daging','meat','sayur','buah','fruit','keju','cheese','yogurt']],
  ['tagihan',  ['pulsa','paket data','listrik','token','wifi','internet','tagihan','bill','electric','water','gas']],
  ['transport',['bensin','pertalite','pertamax','solar','fuel','petrol','diesel','parkir','parking','tol','toll','tiket','ticket','ojek','grab','gojek','taxi','bus','kereta','train']],
  ['sehat',    ['obat','vitamin','medicine','apotek','pharmacy','masker medis','plester','paracetamol','panadol']],
  ['belanja',  ['sabun','shampoo','sampo','pasta gigi','toothpaste','deterjen','detergent','tissue','tisu','pembersih','sikat','popok','diaper','kantong','plastik']],
];
function guessCat(name){
  const n=String(name||'').toLowerCase();
  for(const [id,kws] of CAT_HINTS){
    if(!S.categories.some(c=>c.id===id)) continue;
    if(kws.some(k=>n.includes(k))) return id;
  }
  return S.categories.some(c=>c.id==='belanja')?'belanja':(S.categories.find(c=>c.type==='out')||{}).id||'';
}

/* --- OCR ---
   Mesin OCR dibuat SEKALI lalu dipakai ulang selama sesi. Penyiapannya
   memakan waktu jauh lebih lama daripada pembacaannya sendiri, jadi
   sekali dibuat, scan berikutnya terasa langsung. */
let OCR_WORKER=null, OCR_MAKING=null, OCR_PROGRESS=null;
function ocrReport(m){
  if(!OCR_PROGRESS) return;
  if(m.status==='recognizing text') OCR_PROGRESS('Membaca struk…', 45+Math.round((m.progress||0)*50));
  else if(/loading|initializ|download/i.test(m.status||'')) OCR_PROGRESS('Menyiapkan mesin OCR (sekali saja)…', 8+Math.round((m.progress||0)*35));
}
/* Model yang tidak tersedia membuat pembuatan worker menggantung, bukan
   melempar error. Karena itu alamat model dicek lebih dulu, dan pembuatan
   worker diberi batas waktu supaya tidak menunggu selamanya. */
function headOk(url, ms=6000){
  return new Promise(res=>{
    let done=false;
    const ac=typeof AbortController!=='undefined'?new AbortController():null;
    const t=setTimeout(()=>{ if(!done){ done=true; if(ac)ac.abort(); res(false); } }, ms);
    fetch(url,{method:'HEAD', signal:ac?ac.signal:undefined})
      .then(r=>{ if(!done){ done=true; clearTimeout(t); res(!!r.ok); } })
      .catch(()=>{ if(!done){ done=true; clearTimeout(t); res(false); } });
  });
}
async function pickLangPath(P){
  const file='/eng.traineddata'+(P.gzip!==false?'.gz':'');
  for(const lp of [P.lang, P.langFallback].filter(Boolean)){
    if(await headOk(String(lp).replace(/\/+$/,'')+file)) return lp;
  }
  return P.langFallback||P.lang;                 // upaya terakhir, biarkan Tesseract mencoba
}
async function ocrWorker(){
  if(OCR_WORKER) return OCR_WORKER;
  if(OCR_MAKING) return OCR_MAKING;
  OCR_MAKING=(async()=>{
    const P=ocrPaths();
    if(!window.Tesseract) await loadScript(P.lib);
    const langPath=await pickLangPath(P);
    const w=await Promise.race([
      Tesseract.createWorker('eng',1,{workerPath:P.worker, corePath:P.core, langPath, gzip:P.gzip!==false, logger:ocrReport}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('penyiapan terlalu lama, periksa koneksi')),120000))
    ]);
    // struk = satu kolom teks; melewati analisis tata letak mempercepat ±30%
    await w.setParameters({tessedit_pageseg_mode:'6'});
    OCR_WORKER=w;
    return w;
  })();
  try{ return await OCR_MAKING; }
  finally{ OCR_MAKING=null; }
}
function ocrRelease(){                        // bebaskan memori saat aplikasi dikunci
  const w=OCR_WORKER; OCR_WORKER=null;
  if(w) w.terminate().catch(()=>{});
}
async function runOCR(dataUrl, onProgress){
  OCR_PROGRESS=onProgress;
  try{
    onProgress('Menyiapkan pembaca teks…',5);
    const w=await ocrWorker();
    onProgress('Membaca struk…',45);
    const {data:{text}}=await w.recognize(dataUrl);
    return text;
  }catch(e){
    ocrRelease();                             // supaya percobaan berikutnya mulai bersih
    throw e;
  }finally{ OCR_PROGRESS=null; }
}
/* perkecil + naikkan kontras supaya teks struk lebih terbaca */
function prepImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('gagal membaca berkas'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('berkas ini bukan gambar'));
      img.onload=()=>{
        const max=1600, sc=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d'); cx.drawImage(img,0,0,w,h);
        try{
          const d=cx.getImageData(0,0,w,h), a=d.data;
          for(let i=0;i<a.length;i+=4){
            const g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
            const v=Math.max(0,Math.min(255,(g-128)*1.6+128));   // kontras
            a[i]=a[i+1]=a[i+2]=v;
          }
          cx.putImageData(d,0,0);
        }catch(e){/* canvas terproteksi — pakai apa adanya */}
        res(cv.toDataURL('image/jpeg',0.9));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function scanKeepMeta(){ const d=$('#scanDate'), n=$('#scanNote'); if(d)SCAN.date=d.value||SCAN.date; if(n)SCAN.note=n.value; }
window.scanSave=split=>{
  scanKeepMeta();
  const items=SCAN.items.filter(x=>(Number(x.p)||0)>0 && String(x.n).trim());
  if(!items.length) return toast('Belum ada barang dengan harga.');
  const date=SCAN.date||todayStr(), who=UI.who, note=SCAN.note.trim();
  const mk=(list,catId)=>{
    const amount=list.reduce((a,x)=>a+(Number(x.p)||0),0);
    return {id:L.deviceId.slice(0,4)+'-'+Date.now().toString(36)+rid(4), type:'out', amount, catId, who, date,
      note:note||('Struk · '+list.length+' barang'), items:list.map(x=>({n:x.n,q:x.q||1,p:Number(x.p)||0})), at:Date.now()};
  };
  const made=[];
  if(split){
    for(const g of [...new Set(items.map(x=>x.c))]) made.push(mk(items.filter(x=>x.c===g), g));
  }else{
    const tally={}; for(const x of items) tally[x.c]=(tally[x.c]||0)+(Number(x.p)||0);
    const main=Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
    made.push(mk(items, main));
  }
  for(const t of made){ S.tx.push(t); pushTxCloud(t); }
  save();
  closeModal();
  UI.month=date.slice(0,7); UI.who=who;
  render();
  const warn=made.map(limitAlert).filter(Boolean)[0];
  toast(warn || `🧾 Tersimpan: ${items.length} barang${made.length>1?' dalam '+made.length+' transaksi':''}.`);
};

function limitAlert(t){
  if(t.type!=='out') return '';
  const k=t.date.slice(0,7), w=whoOf(t), s=sums(k,w), msgs=[];
  const c=S.categories.find(x=>x.id===t.catId);
  if(c){
    const b=monthLimit(c,w,k), spent=s.byCatOut[c.id]||0;
    if(b>0&&spent>b) msgs.push(`${c.icon} ${c.name} lewat batas ${rp(spent-b)}`);
    else if(b>0&&spent>b*.8) msgs.push(`${c.icon} ${c.name} sudah ${Math.round(spent/b*100)}% dari batas`);
  }
  const tl=totalLimit(w);
  if(tl>0&&s.out>tl) msgs.push(`total bulan ini lewat batas ${rp(s.out-tl)}`);
  return msgs.length?'⚠️ '+msgs.join(' · '):'';
}

      <div id="lockMsg" class="small" style="color:var(--out);font-weight:700;min-height:18px;margin:8px 0"></div>
      <button class="btn" onclick="tryUnlock()">Buka</button>

/* =====================================================================
   SINKRONISASI 2 HP (Firebase Firestore — akun milik pengguna sendiri).
   Semua perangkat dengan Kode Sinkronisasi yang sama saling terhubung
   real-time. Panduan pembuatan akun: PANDUAN_KEUANGAN.md
   ===================================================================== */
const SYNC={db:null, on:false, timers:{}};
const kvPath=id=>`couples/${S.settings.sync.coupleId}/kv/${id}`;
const txPath=id=>`couples/${S.settings.sync.coupleId}/tx/${id}`;
function setSyncBadge(state,msg){
  const label=state==='on'?'☁️ Tersinkron':state==='err'?'☁️ Gagal':'☁️ Lokal';
  const d=$('#syncDot'); if(d){ d.className='syncdot '+state; d.textContent=label; d.title=msg||label; }
  const st=$('#syStatus'); if(st) st.textContent=msg||label;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('tidak bisa memuat '+src+' — periksa koneksi internet')); document.head.appendChild(s);});}
async function syncInit(){
  const sy=S.settings.sync||{};
  if(!sy.enabled||!sy.apiKey||!sy.projectId||!sy.coupleId){ SYNC.on=false; setSyncBadge('off'); return; }
  try{
    setSyncBadge('off','☁️ Menyambungkan…');
    if(!window.firebase){
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
    }
    if(!firebase.apps.length) firebase.initializeApp({apiKey:sy.apiKey, authDomain:sy.projectId+'.firebaseapp.com', projectId:sy.projectId});
    SYNC.db=firebase.firestore();
    try{ await SYNC.db.enablePersistence({synchronizeTabs:true}); }catch(e){/* tab lain sudah memegang */}
    SYNC.on=true;
    // perangkat pertama yang tersambung mengunggah data lokalnya ke cloud
    const probe=await SYNC.db.doc(kvPath('categories')).get();
    if(!probe.exists) await pushAllToCloud();
    listenCloud();
    if(PENDING_CATS){ PENDING_CATS=false; pushKV('categories'); }
    setSyncBadge('on');
  }catch(err){
    SYNC.on=false;
    setSyncBadge('err','☁️ Gagal: '+err.message);
    toast('☁️ Sinkronisasi gagal: '+err.message);
  }
}
window.syncSave=()=>{
  S.settings.sync={
    enabled:$('#syOn').checked,
    apiKey:$('#syApi').value.trim(),
    projectId:$('#syProj').value.trim(),
    coupleId:$('#syCid').value.trim(),
  };
  save();
  if(S.settings.sync.enabled){
    if(!S.settings.sync.apiKey||!S.settings.sync.projectId||!S.settings.sync.coupleId) return toast('Lengkapi API Key, Project ID, dan Kode Sinkronisasi dulu.');
    location.reload(); // mulai bersih dengan konfigurasi baru
  }else{ SYNC.on=false; setSyncBadge('off'); toast('Sinkronisasi dimatikan — data tetap aman di HP ini.'); }
};
function queueSync(id){
  if(!SYNC.on) return;
  clearTimeout(SYNC.timers[id]);
  SYNC.timers[id]=setTimeout(()=>pushKV(id),700);
}
function pushKV(id){
  if(!SYNC.on) return;
  let data;
  if(id==='categories') data=S.categories;
  else if(id==='reviews') data=S.reviews;
  else if(id==='settings') data={nameA:S.settings.nameA, nameB:S.settings.nameB, currency:S.settings.currency, limitTotal:S.settings.limitTotal, pin:S.settings.pin, autolock:S.settings.autolock};
  SYNC.db.doc(kvPath(id)).set({j:JSON.stringify(data), dev:L.deviceId, at:Date.now()})
    .then(()=>setSyncBadge('on'))
    .catch(e=>setSyncBadge('err','☁️ Gagal kirim: '+e.message));
}
function pushTxCloud(t){
  if(!SYNC.on) return;
  SYNC.db.doc(txPath(t.id)).set({j:JSON.stringify(t), dev:L.deviceId, at:Date.now()})
    .then(()=>setSyncBadge('on'))
    .catch(e=>setSyncBadge('err','☁️ Gagal kirim: '+e.message));
}
function deleteTxCloud(id){ if(SYNC.on) SYNC.db.doc(txPath(id)).delete().catch(()=>{}); }
async function pushAllToCloud(){
  for(const id of ['categories','settings','reviews']) pushKV(id);
  for(const t of S.tx) pushTxCloud(t);
}
function listenCloud(){
  const cid=S.settings.sync.coupleId;
  SYNC.db.collection(`couples/${cid}/kv`).onSnapshot(snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(!d||d.dev===L.deviceId) return;
      let val; try{ val=JSON.parse(d.j); }catch(e){ return; }
      if(val==null) return;
      const id=ch.doc.id;
      if(id==='categories'){ S.categories=val; changed=true; }
      else if(id==='settings'){ Object.assign(S.settings,{nameA:val.nameA??S.settings.nameA, nameB:val.nameB??S.settings.nameB, currency:val.currency??S.settings.currency, limitTotal:val.limitTotal??S.settings.limitTotal, pin:val.pin??S.settings.pin, autolock:val.autolock??S.settings.autolock}); changed=true; }
      else if(id==='reviews'){
        for(const k in val){ const cur=S.reviews[k]; if(!cur||(val[k].at||0)>=(cur.at||0)) S.reviews[k]=val[k]; }
        changed=true;
      }
    });
    if(changed){ save(); remoteRefresh(); }
  }, e=>setSyncBadge('err','☁️ '+e.message));
  SYNC.db.collection(`couples/${cid}/tx`).onSnapshot(snap=>{
    let changed=false;
    snap.docChanges().forEach(ch=>{
      if(ch.type==='removed'){ const n=S.tx.length; S.tx=S.tx.filter(t=>t.id!==ch.doc.id); if(S.tx.length!==n) changed=true; return; }
      const d=ch.doc.data();
      if(!d||d.dev===L.deviceId) return;
      let t; try{ t=JSON.parse(d.j); }catch(e){ return; }
      if(!t||!t.id) return;
      const i=S.tx.findIndex(x=>x.id===t.id);
      if(i>=0){ if((t.at||0)>=(S.tx[i].at||0)){ S.tx[i]=t; changed=true; } }
      else{ S.tx.push(t); changed=true; }
    });
    if(changed){ save(); remoteRefresh(); }
  }, e=>setSyncBadge('err','☁️ '+e.message));
}
let _rrT=null;
function remoteRefresh(){
  clearTimeout(_rrT);
  _rrT=setTimeout(()=>{
    setSyncBadge('on');
    if($('#overlay').classList.contains('open')) return; // jangan ganggu saat sedang mengisi form
    render();
    toast('🔄 Ada catatan baru dari HP satunya');
  },400);
}

/* ---------- ekspor / impor / demo / hapus ---------- */
window.exportJson=()=>{
  const data={app:'catatan-keuangan', version:1, exportedAt:new Date().toISOString(),
    settings:{nameA:S.settings.nameA, nameB:S.settings.nameB, currency:S.settings.currency, limitTotal:S.settings.limitTotal, pin:S.settings.pin, autolock:S.settings.autolock},
    categories:S.categories, tx:S.tx, reviews:S.reviews};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='catatan-keuangan-'+todayStr().replace(/-/g,'')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('⬇️ Cadangan diunduh.');
};
window.importJson=inp=>{
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.tx)||!Array.isArray(d.categories)) throw new Error('format tidak dikenal');
      if(!confirm('Impor akan MENGGANTI data di HP ini dengan isi file ('+d.tx.length+' transaksi). Lanjutkan?')) return;
      S.categories=d.categories; S.tx=d.tx; S.reviews=d.reviews||{};
      if(d.settings){ S.settings.nameA=d.settings.nameA||S.settings.nameA; S.settings.nameB=d.settings.nameB||S.settings.nameB; S.settings.currency=d.settings.currency||S.settings.currency; S.settings.limitTotal=d.settings.limitTotal||S.settings.limitTotal; S.settings.pin=d.settings.pin||S.settings.pin; if(d.settings.autolock!==undefined) S.settings.autolock=d.settings.autolock; }
      save(); render(); toast('⬆️ Data berhasil diimpor.');
      if(SYNC.on) pushAllToCloud();
    }catch(e){ toast('❌ File tidak valid: '+e.message); }
    inp.value='';
  };
  r.readAsText(f);
};
window.wipeAll=async()=>{
  if(!confirm('Hapus SEMUA data (transaksi, review, kategori) di HP ini'+(SYNC.on?' DAN di cloud (HP satunya ikut terhapus)':'')+'?')) return;
  if(!confirm('Yakin? Tindakan ini tidak bisa dibatalkan.')) return;
  if(SYNC.on){
    try{
      const snap=await SYNC.db.collection(`couples/${S.settings.sync.coupleId}/tx`).get();
      for(const d of snap.docs) await d.ref.delete();
      for(const id of ['categories','settings','reviews']) await SYNC.db.doc(kvPath(id)).delete().catch(()=>{});
    }catch(e){/* biarkan */}
  }
  const sy=S.settings.sync;
  S={settings:{nameA:'Orang 1', nameB:'Orang 2', sync:sy}, categories:defaultCats(), tx:[], reviews:{}};
  L.setupDone=false;
  save(); saveL();
  location.reload();
};
