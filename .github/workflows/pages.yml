name: Publish ke GitHub Pages

# Menyalin isi branch main ke branch gh-pages pada setiap push.
# GitHub Pages mempublikasikan branch gh-pages secara otomatis,
# tanpa perlu akses API Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dorong isi main ke gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git push -f origin gh-pages
